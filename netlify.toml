[build]
  command = "pnpm install && pnpm build:words-db && pnpm build:readers && VITE_BUILD_ID=$COMMIT_REF pnpm --filter client build"
  publish = "client/dist"

[functions]
  directory = "netlify/functions"
  # firebase-admin must not be bundled. It pulls in google-gax/grpc, which uses
  # __dirname and loads .proto files from disk at runtime; inlining it produces a
  # function that throws "__dirname is not defined in ES module scope" on the
  # first Firestore call. Shipping it as a real node_module is the fix.
  external_node_modules = ["firebase-admin"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/words.db"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sql-wasm.wasm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Reader assets are fetched with ?v=$COMMIT_REF, so the URL changes whenever the
# content does. Without this they fall back to must-revalidate and the cache-buster
# buys nothing but a conditional request per chapter navigation.
[[headers]]
  for = "/data/readers/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
