[build]
  command = "pnpm install && pnpm build:words-db && pnpm build:readers && VITE_BUILD_ID=$COMMIT_REF pnpm build:app && pnpm build:site && node scripts/assemble-dist.mjs"
  publish = "apps/site/dist"

[functions]
  directory = "netlify/functions"
  # firebase-admin must not be bundled. It pulls in google-gax/grpc, which uses
  # __dirname and loads .proto files from disk at runtime; inlining it produces a
  # function that throws "__dirname is not defined in ES module scope" on the
  # first Firestore call. Shipping it as a real node_module is the fix.
  external_node_modules = ["firebase-admin"]

# SPA fallback, scoped to /app. It must NOT be `/*` any more: a catch-all would
# swallow the marketing pages and serve the app shell for every 404, which would
# also stop Netlify serving Astro's 404.html.
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# Fingerprinted by Vite, so the filename changes whenever the content does.
[[headers]]
  for = "/app/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app/words.db"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app/sql-wasm.wasm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Reader assets are fetched with ?v=$COMMIT_REF, so the URL changes whenever the
# content does. Without this they fall back to must-revalidate and the cache-buster
# buys nothing but a conditional request per chapter navigation.
[[headers]]
  for = "/app/data/readers/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The marketing pages are the ones search engines and ad clicks land on. HTML
# stays revalidated so a copy change ships immediately; the hashed CSS/JS Astro
# emits is immutable.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Baseline security headers. Lighthouse's best-practices audit checks for CSP and
# HSTS; these are also just correct. The CSP is deliberately strict because the
# marketing site ships no JavaScript at all — the only inline element is the
# JSON-LD block, which is not script-src-executable content.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
